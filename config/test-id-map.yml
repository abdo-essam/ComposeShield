# Test ID Mapping: Kotlin test class/method → requirement matrix ID
#
# Format:
#   <test_id>:
#     class: fully.qualified.TestClassName
#     method: optionalMethodName          # omit to map the whole class
#     test_name: "Human-readable label"
#     platform: android | ios | cross
#     environment: physical | simulator | host-jvm
#
# This file is read by the generateValidationReport Gradle task (T008).
# Adding a new requirement: add an entry here + a matching test method. No YAML change needed.

