org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# KT-81505: the AGP KMP library plugin once published Android variants with
# kotlinPlatformType=jvm instead of androidJvm, breaking consumer resolution.
# Fixed in AGP 9.0.0-alpha14 (already in use),# attribute explicit and version-stable.
android.kmp.use.jvm.platform.type=false

# Dokka V2 configuration mode with V1 compatibility helpers (e.g. dokkaHtml task)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
