org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# KT-81505: the AGP KMP library plugin once published Android variants with
# kotlinPlatformType=jvm instead of androidJvm, breaking consumer resolution.
# Fixed in AGP 9.0.0-alpha14 (already in use), but this flag makes the correct
# attribute explicit and version-stable.
android.kmp.use.jvm.platform.type=false
