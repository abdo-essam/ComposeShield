name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need an Apple host. Robolectric asserts FLAG_SECURE was requested,
  # which is the correct contract test for the library's own behaviour, and it runs free here.
  jvm:
    name: Common, Android & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Common logic tests
        run: ./gradlew :composeshield:testAndroidHostTest

      - name: Static analysis and formatting
        run: ./gradlew detekt spotlessCheck

  # Pinned deliberately. CMP 1.11.x's ui-uikit hard-references _OBJC_CLASS_$_UIViewLayoutRegion,
  # which only exists in the iOS 26 SDK, so the Xcode 16 line (macos-15) fails at link time with
  # "Undefined symbols ... UIViewLayoutRegion" (fixed upstream only in CMP 1.12.0-rc01, #3278).
  # `macos-latest` is never used — it silently jumps Xcode majors. `macos-*-large`/`-intel` are
  # Intel and cannot run iosSimulatorArm64 at all (research.md R11).
  apple:
    name: iOS tests & ABI check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: iOS simulator tests
        run: ./gradlew :composeshield:iosSimulatorArm64Test

      # Must run here, not on Ubuntu: keepLocallyUnsupportedTargets = false means the Apple ABI
      # is never inferred, so this check is only meaningful where Apple targets compile.
      - name: Binary compatibility
        run: ./gradlew :composeshield:checkKotlinAbi
