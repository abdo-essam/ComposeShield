name: Android Physical Device Tests (FTL)

# Reusable workflow — called by on-demand.yml and release.yml.
# Eliminates the android-physical job duplication between the two callers.
# Callers pass the run-id prefix so artifacts are namespaced correctly (FR-023).
on:
  workflow_call:
    inputs:
      artifact_prefix:
        description: "Prefix for artifact names (e.g. 'on-demand' or 'release')"
        required: true
        type: string
      results_dir_prefix:
        description: "FTL results-dir prefix (e.g. 'on-demand' or 'release')"
        required: true
        type: string
    secrets:
      FIREBASE_TEST_LAB_SERVICE_ACCOUNT:
        required: true
      GCP_PROJECT_ID:
        required: false

jobs:
  android-physical:
    name: Android physical device (FTL Spark)
    runs-on: ubuntu-latest
    # Device model and OS version come from env vars that mirror config/device-matrix.yml.
    # To change the device: update config/device-matrix.yml AND the env block below.
    # A future improvement (T043+) could parse device-matrix.yml here directly via yq.
    env:
      FTL_DEVICE_MODEL: oriole
      FTL_OS_VERSION: "33"
    steps:
        # renovate: datasource=github-actions
      - uses: actions/checkout@v7

        # renovate: datasource=github-actions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

        # renovate: datasource=github-actions
      - uses: gradle/actions/setup-gradle@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure GCP Project
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          fi
          echo "Setting GCP project to: $PROJECT_ID"
          gcloud config set project "$PROJECT_ID"

      - name: Build instrumentation APK
        run: ./gradlew :sample:androidApp:assembleDebug :composeshield:assembleAndroidTest

      # FTL Spark auto-creates the results bucket — no --results-bucket needed on Spark tier.
      # The results URL is printed to stdout and captured for the download step.
      # Test IDs covered: C-001, C-002, C-003, A-001, I-001, R-001
      - name: Run instrumentation tests on FTL
        id: ftl_run
        run: |
          echo "▶ Launching Firebase Test Lab on ${{ env.FTL_DEVICE_MODEL }} (Android ${{ env.FTL_OS_VERSION }})..."
          gcloud firebase test android run \
            --type instrumentation \
            --app sample/androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            --test composeshield/build/outputs/apk/androidTest/composeshield-androidTest.apk \
            --device model=${{ env.FTL_DEVICE_MODEL }},version=${{ env.FTL_OS_VERSION }} \
            --results-dir=${{ inputs.results_dir_prefix }}-${{ github.run_id }} \
            --timeout 600s 2>&1 | tee ftl_run.log

          # gcloud may print either a gs:// URL or an HTTPS console URL like
          # https://console.developers.google.com/storage/browser/<bucket>/<dir>/
          # depending on version — accept both and normalize to gs://.
          RAW_URL=$(grep -oE '(gs://[^] ]*|storage/browser/[^] ]*)' ftl_run.log | head -1 || true)
          if [ -z "$RAW_URL" ]; then
            echo "::error::Could not find FTL results location in gcloud output"
            exit 1
          fi
          case "$RAW_URL" in
            storage/browser/*)
              RESULTS_URL="gs://${RAW_URL#storage/browser/}"
              ;;
            *)
              RESULTS_URL="$RAW_URL"
              ;;
          esac
          RESULTS_URL="${RESULTS_URL%/}"
          echo "Extracted Results Bucket URL: $RESULTS_URL"
          echo "ftl_results_url=${RESULTS_URL}" >> "$GITHUB_OUTPUT"

      - name: Download FTL results
        if: always()
        run: |
          mkdir -p ftl-results
          RESULTS_URL="${{ steps.ftl_run.outputs.ftl_results_url }}"
          if [ -n "$RESULTS_URL" ]; then
            echo "Downloading results from $RESULTS_URL..."
            gsutil -m cp -r "$RESULTS_URL/*" ./ftl-results/ 2>/dev/null || gsutil -m cp -r "$RESULTS_URL" ./ftl-results/ || true
          fi
          echo "Downloaded files:"
          find ftl-results -type f || true
          # Fail loudly: a silent download failure used to surface downstream as a
          # fully-"blocked" validation report with no evidence artifacts.
          XML_COUNT=$(find ftl-results -name '*.xml' | wc -l)
          if [ "$XML_COUNT" -eq 0 ]; then
            echo "::error::FTL results download produced no JUnit XML — screenshots/videos/report would be empty."
            exit 1
          fi

      # T034 (US4): Extract device model and OS version from FTL result JSON so the
      # report generator can populate device_model and os_version fields (FR-024).
      # Emitted as device-metadata.json included in the screenshots artifact.
      - name: Extract device metadata
        if: always()
        run: |
          mkdir -p ftl-results
          cat > ftl-results/device-metadata.json << EOF
          {
            "device_model": "${{ env.FTL_DEVICE_MODEL }}",
            "os_version": "${{ env.FTL_OS_VERSION }}",
            "run_id": "${{ github.run_id }}",
            "results_dir": "${{ inputs.results_dir_prefix }}-${{ github.run_id }}",
            "captured_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "✅ device-metadata.json written"

      - name: Upload JUnit XML
        if: always()
        # renovate: datasource=github-actions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-junit-xml-${{ github.run_id }}
          path: ftl-results/
          retention-days: 30

      - name: Upload protected screenshot evidence
        if: always()
        # renovate: datasource=github-actions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-screenshots-${{ github.run_id }}
          path: ftl-results/**/*.png
          retention-days: 30

      # FTL records a video per test case by default (--record-video); surface the
      # downloaded .mp4 files as their own artifact so they sit next to the screenshots.
      - name: Upload test run videos
        if: always()
        # renovate: datasource=github-actions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-videos-${{ github.run_id }}
          path: ftl-results/**/*.mp4
          retention-days: 30
